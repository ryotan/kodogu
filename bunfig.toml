# Mitigate supply-chain attacks: only resolve npm package versions that have
# been published for at least 7 days. Mirrors `minimumReleaseAge` in
# `.github/renovate.json5`, so manual `bun add` / `bun install` enforces the
# same cooldown as automated bumps.
#
# Known bun-side caveats (do not affect normal `bun install` / `bun add`):
#   - `bun update --latest` does not propagate the filter to transitive deps
#     (oven-sh/bun#25305)
#   - `bunx --minimum-release-age` is a no-op (oven-sh/bun#30748)
[install]
minimumReleaseAge = 604800  # 7 days, in seconds
