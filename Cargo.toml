[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 0

[workspace]
resolver = "3"
members = [
  'kernel/codec',
  'kernel/crypto',
  'cli-app/anflug',
  'app/src-tauri',
]

[workspace.dependencies]
# Workspace members
codec = { path = './kernel/codec' }
crypto = { path = './kernel/crypto' }

# External crates
aes = "0.8"
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
argon2 = "0.5"
bcrypt-pbkdf = "0.10.0"
bs58 = "0.5"
cbc = "0.1"
chacha20 = "0.10"
chacha20poly1305 = "0.10"
chrono = "0.4.44"
clap = "4.5.60"
cmac = "0.7"
concat-kdf = "0.1.0"
confy = "2.0.0"
criterion = "0.8"
ctr = "0.9"
data-encoding = "2.10"
data-encoding-macro = "0.1"
ed25519-dalek = "2.2"
futures = "0.3"
hex-literal = "1.1"
hkdf = "0.12"
hmac = "0.12"
openidconnect = "4.0.1"
p256 = "0.13"
p384 = "0.13"
pbkdf2 = "0.12"
percent-encoding = "2.3"
pkcs8 = "0.10"
poly1305 = "0.8"
proptest = "1.10"
quoted_printable = "0.5"
dirs = "6.0.0"
rand = "0.10"
redb = "4.0.0"
regex = "1.12.3"
rmp-serde = "1.3.1"
rsa = "0.9"
scrypt = "0.11"
serde = "1"
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
suzunari-error = "0.2.0"
tauri = "2"
tauri-build = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
time = "0.3.41"
tempfile = "3.22.0"
tokio = "1.49"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
validator = "0.20"
zeroize = { version = "1.8", features = ["derive"] }


[workspace.package]
description = "ちょっとした小道具たち"
version = '0.1.0'
edition = '2024'
repository = 'https://github.com/ryotan/kodogu'
license = 'MIT OR Apache-2.0'
authors = ['ryotan']
