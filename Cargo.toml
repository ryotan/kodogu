[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 0

[workspace]
resolver = "3"
members = [
  'kernel/codec',
  'kernel/crypto',
  'cli-app/anflug',
  'app/src-tauri',
]

[workspace.dependencies]
# Workspace members
codec = { path = './kernel/codec' }
crypto = { path = './kernel/crypto' }

# External crates
aes = "=0.8.4"
aes-gcm = "=0.10.3"
aes-gcm-siv = "=0.11.1"
argon2 = "=0.5.3"
bcrypt-pbkdf = "=0.11.0"
bs58 = "=0.5.1"
cbc = "=0.1.2"
chacha20 = "=0.10.0"
chacha20poly1305 = "=0.10.1"
chrono = "=0.4.45"
clap = "=4.6.1"
cmac = "=0.7.2"
concat-kdf = "=0.1.0"
confy = "=2.0.0"
criterion = "=0.8.2"
ctr = "=0.9.2"
data-encoding = "=2.11.0"
data-encoding-macro = "=0.1.20"
ed25519-dalek = "=2.2.0"
futures = "=0.3.32"
hex-literal = "=1.1.0"
hkdf = "=0.12.4"
hmac = "=0.12.1"
openidconnect = "=4.0.1"
p256 = "=0.13.2"
p384 = "=0.13.1"
pbkdf2 = "=0.13.0"
percent-encoding = "=2.3.2"
pkcs8 = "=0.10.2"
poly1305 = "=0.8.0"
proptest = "=1.11.0"
quoted_printable = "=0.5.2"
dirs = "=6.0.0"
rand = "=0.10.1"
redb = "=4.1.0"
regex = "=1.12.3"
rmp-serde = "=1.3.1"
rsa = "=0.9.10"
scrypt = "=0.12.0"
serde = "=1.0.228"
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
suzunari-error = "=0.2.0"
tauri = "=2.11.2"
tauri-build = "=2.6.2"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-http = "=2.5.9"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-window-state = "=2.4.1"
time = "=0.3.47"
tempfile = "=3.27.0"
tokio = "=1.52.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
validator = "=0.20.0"
zeroize = { version = "=1.8.2", features = ["derive"] }


[workspace.package]
description = "ちょっとした小道具たち"
version = '0.1.0'
edition = '2024'
repository = 'https://github.com/ryotan/kodogu'
license = 'MIT OR Apache-2.0'
authors = ['ryotan']
