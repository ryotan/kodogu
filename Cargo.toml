[profile.dev]
incremental = true
opt-level = 0

[profile.dev.package."*"]
opt-level = 0

[workspace]
resolver = "3"
members = [
  'kernel/codec',
  'kernel/crypto',
  'cli-app/anflug',
  'app/src-tauri',
]

[workspace.dependencies]
# Workspace members
codec = { path = './kernel/codec' }
crypto = { path = './kernel/crypto' }

# External crates
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes-gcm-siv = "=0.11.1"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
bcrypt-pbkdf = { version = "=0.10.0", features = ["zeroize"] }
bs58 = "=0.5.1"
cbc = { version = "=0.1.2", features = ["zeroize"] }
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
chrono = "=0.4.45"
clap = "=4.6.7"
cmac = { version = "=0.7.2", features = ["zeroize"] }
concat-kdf = "=0.1.0"
confy = "=2.0.0"
criterion = "=0.8.2"
ctr = { version = "=0.9.2", features = ["zeroize"] }
data-encoding = "=2.11.1"
data-encoding-macro = "=0.1.21"
ed25519-dalek = "=2.2.0"
futures = "=0.3.34"
hex-literal = "=1.1.0"
hkdf = "=0.12.4"
hmac = "=0.12.1"
p256 = "=0.13.2"
p384 = "=0.13.1"
pbkdf2 = "=0.12.2"
percent-encoding = "=2.3.2"
pkcs8 = "=0.10.2"
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
proptest = "=1.12.0"
quoted_printable = "=0.5.2"
dirs = "=7.0.0"
rand = "=0.9.4"
redb = "=4.3.0"
regex = "=1.13.1"
rmp-serde = "=1.3.1"
rsa = "=0.9.10"
scrypt = "=0.11.0"
serde = "=1.0.229"
serde_json = "=1.0.152"
sha2 = "=0.10.9"
subtle = "=2.6.1"
suzunari-error = "=0.3.0"
tauri = "=2.12.3"
tauri-build = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.4.2"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-http = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-window-state = "=2.5.0"
time = "=0.3.55"
tempfile = "=3.27.0"
tokio = "=1.53.2"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
validator = "=0.21.0"
zeroize = { version = "=1.8.2", features = ["derive"] }


[workspace.package]
description = "ちょっとした小道具たち"
version = '0.1.0'
edition = '2024'
repository = 'https://github.com/ryotan/kodogu'
license = 'MIT OR Apache-2.0'
authors = ['ryotan']
