[package]
name = "codec"
description = "Encoding and decoding library for KoDoGu - supports UTF-8, Hex, Base32/58/64/85, URL encoding, and Quoted-Printable"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[lints]
workspace = true

[lib]
name = "codec"
path = "src/lib.rs"

[dependencies]
# Error handling
suzunari-error = { workspace = true }

# Base encodings
data-encoding = { workspace = true }       # Base16, 32, 64
data-encoding-macro = { workspace = true } # Compile-time encoding definitions
bs58 = { workspace = true }                # Base58

# URL and MIME encodings
percent-encoding = { workspace = true }    # URL Encoding
quoted_printable = { workspace = true }    # Quoted-Printable

[dev-dependencies]
# Property-based testing
proptest = { workspace = true }
