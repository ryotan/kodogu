name: 'Dependency Review'

# Covers the GitHub Actions dependencies, which osv-scanner.yaml does not scan.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: 'Dependency Review'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write # The action posts a summary comment on failure.
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # Audit until the egress is baselined from real runs.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
