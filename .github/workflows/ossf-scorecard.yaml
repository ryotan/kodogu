name: 'Scorecard'

on:
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'

# Default-deny token permissions; the analysis job below grants the extra scope it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: 'Scorecard analysis'
    runs-on: ubuntu-latest
    # This repository is private, so results can't be published to the public Scorecard dataset and SARIF
    # upload to Code Scanning needs GitHub Advanced Security, which we do not have here. Several checks
    # (e.g. Maintained, Code-Review) query commit/review/check-run history via the GitHub GraphQL API, which
    # 403s on private repos without these extra read scopes — see the "Permissions (Private Repo)" section of
    # https://github.com/ossf/scorecard-action#example.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden Runner
        # New workflow — audit first to baseline expected egress, then switch to block once we have a
        # sample of real runs (same rollout process used for the other workflows in this repo).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: 'Checkout code'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Run analysis'
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: 'Upload artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
