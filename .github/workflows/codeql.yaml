name: 'CodeQL'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 2 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny token permissions; the analysis job grants what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: 'CodeQL (${{ matrix.language }})'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # Uploads the analysis to code scanning.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The languages GitHub's default setup detects in this repository.
        language:
          - actions
          - javascript-typescript
          - rust
    steps:
      - name: Harden Runner
        # Audit until the egress is baselined from real runs.
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
