name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default-deny token permissions; jobs grant the extra scopes they need.
permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

jobs:
  checks:
    name: 'Lint - ${{ matrix.platform }}'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-26.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        # Linux endpoints were verified in audit mode; keep its existing block policy.
        # macOS and Windows use audit mode, supported by the community tier, to record their endpoints.
        # disable-telemetry is only supported with the block policy.
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          disable-telemetry: ${{ runner.os == 'Linux' }}
          allowed-endpoints: >
            aka.ms:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            cli.codecov.io:443
            dl.google.com:443
            download.visualstudio.microsoft.com:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            mise.jdx.dev:443
            motd.ubuntu.com:443
            nodejs.org:443
            o26192.ingest.us.sentry.io:443
            packages.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            storybook.js.org:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443
            *.ec2.archive.ubuntu.com:80

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --error-on=any
          # Disable retries while updating APT to prevent CVE-2026-109518 before installing dependencies.
          sudo apt-get -o Acquire::Retries=0 install -y --only-upgrade '?source-package(^apt$)'
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspace-crates: true

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Set cache paths
        run: |
          echo "MISE_CACHE_DIR=$RUNNER_TEMP/mise-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"

      # Cache the files mise downloads, not the installed tools:
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - name: Cache mise download store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MISE_CACHE_DIR }}/downloads-cas
          key: >-
            mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_ENV }}-${{
            hashFiles('.config/mise/config*.toml', '.config/mise/mise*.lock') }}

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.12'
          cache: false

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: mise exec -- bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSIONS=$(grep -o '"playwright@[^"]*"' bun.lock | tr -d '"')
          if [ -z "$VERSIONS" ]; then
            echo "::warning::Could not extract playwright version from bun.lock. Playwright browsers will not be cached."
          elif [ "$(echo "$VERSIONS" | wc -l)" -gt 1 ]; then
            echo "::warning::Multiple playwright versions found in bun.lock: $VERSIONS. Playwright browsers will not be cached."
          else
            echo "Playwright version: $VERSIONS"
            echo "version=$VERSIONS" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: 0-${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        id: prepare
        run: mise run app:playwright:install

      - id: tsc
        background: true
        name: TypeScript
        run: mise run app:lint:tsc

      - id: biome
        background: true
        name: Biome
        run: mise run lint:biome -- --reporter=github

      - id: deps
        background: true
        name: Dependency Directions
        run: mise run lint:deps

      - id: deps-fixtures
        background: true
        name: Dependency Directions on Fixtures
        run: mise run lint:deps:fixtures

      - id: eslint
        background: true
        name: ESLint
        run: mise run app:lint:es

      - id: rustfmt
        background: true
        name: Rust Format
        run: mise run cargo:lint:fmt

      - id: frontend-test
        background: true
        name: Frontend Tests & Coverage
        run: mise run app:test:coverage

      - name: Wait for parallel checks
        wait-all:

      # Tauri build scripts write shared source-tree schemas across the Rust check target directories.
      - id: clippy
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Clippy
        run: mise run cargo:lint:clippy

      - id: backend-test
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Backend Tests & Coverage${{ runner.os == 'Windows' && ' (excluding Tauri app)' || '' }}
        # tauri-build 2.7.4 omits the Common Controls v6 manifest from the Windows test executables of the crates that
        # depend on Tauri. Keep the coverage of the other crates until a released tauri-build supports resources in
        # test executables.
        # WORKAROUND: wayland-client 0.31.8 uses not stable feature (`coverage_attribute`) of Rust 1.85.1 for coverage
        env:
          COVERAGE_TASK: ${{ runner.os == 'Windows' && 'cargo:coverage:without-tauri' || 'cargo:coverage' }}
        run: mise run "$COVERAGE_TASK" -- --no-cfg-coverage

      - id: doc-test
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        name: Documentation Tests
        run: mise run cargo:test:doc

      - name: Upload browser test failure screenshots
        if: ${{ !cancelled() && steps.frontend-test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: browser-test-failures-${{ runner.os }}
          path: |
            apps/desktop/*/.vitest-attachments/
            tools/*/desktop/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 5

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml,lcov.info
          flags: unittests
          name: codecov-${{ runner.os }}
          fail_ci_if_error: false  # Don't fail on Codecov service issues
          # Note: Coverage requirements are configured in codecov.yml


  lint:
    name: 'Lint'
    timeout-minutes: 5
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check all platform results
        shell: bash
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
