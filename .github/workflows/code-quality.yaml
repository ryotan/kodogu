name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default-deny token permissions; jobs grant the extra scopes they need.
permissions:
  contents: read

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        # Block unexpected egress and process activity on the runner. Endpoints below were baselined from
        # the audit-mode log observed across recent successful runs.
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            aka.ms:443
            azure.archive.ubuntu.com:80
            _http._tcp.azure.archive.ubuntu.com:80
            cli.codecov.io:443
            dl.google.com:443
            _https._tcp.dl.google.com:443
            download.visualstudio.microsoft.com:443
            esm.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            mise.jdx.dev:443
            mise-java.jdx.dev:443
            mise-versions.jdx.dev:443
            motd.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            nodejs.org:443
            o26192.ingest.us.sentry.io:443
            packages.microsoft.com:443
            _https._tcp.packages.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            storybook.js.org:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspace-crates: true

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.6'

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Cache node_modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lock-file

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSIONS=$(grep -o '"playwright@[^"]*"' bun.lock | tr -d '"')
          if [ -z "$VERSIONS" ]; then
            echo "::warning::Could not extract playwright version from bun.lock. Playwright browsers will not be cached."
          elif [ "$(echo "$VERSIONS" | wc -l)" -gt 1 ]; then
            echo "::warning::Multiple playwright versions found in bun.lock: $VERSIONS. Playwright browsers will not be cached."
          else
            echo "Playwright version: $VERSIONS"
            echo "version=$VERSIONS" >> $GITHUB_OUTPUT
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: 0-${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        working-directory: app
        run: bun run playwright:install

      - id: tsc
        name: TypeScript
        working-directory: app
        run: bun run lint:tsc
        continue-on-error: true  # Run all checks, then fail at the end

      - id: biome
        name: Biome
        working-directory: app
        run: bun run lint:biome --reporter=github
        continue-on-error: true  # Run all checks, then fail at the end

      - id: eslint
        name: ESLint
        working-directory: app
        run: bun run lint:es
        continue-on-error: true  # Run all checks, then fail at the end

      - id: rustfmt
        name: Rust Format
        run: mise run cargo:lint:fmt
        continue-on-error: true  # Run all checks, then fail at the end

      - id: clippy
        name: Clippy
        run: mise run cargo:lint:clippy
        continue-on-error: true  # Run all checks, then fail at the end

      - id: frontend-test
        name: Frontend Tests & Coverage
        working-directory: app
        run: bun run test:vitest:coverage
        continue-on-error: true  # Run all checks, then fail at the end

      - id: backend-test
        name: Backend Tests & Coverage
        # WORKAROUND: wayland-client 0.31.8 uses not stable feature (`coverage_attribute`) of Rust 1.85.1 for coverage
        run: mise run cargo:coverage -- --no-cfg-coverage
        continue-on-error: true  # Run all checks, then fail at the end

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/clover.xml,lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail on Codecov service issues
          # Note: Coverage requirements are configured in codecov.yml

      - name: Check for lint and test results
        run: |
          # Fail the build if any lint or test step failed
          # This allows us to see all failures at once, not just the first one
          echo "=== Check Results ==="
          echo "TypeScript: ${{ steps.tsc.outcome }}"
          echo "Biome: ${{ steps.biome.outcome }}"
          echo "ESLint: ${{ steps.eslint.outcome }}"
          echo "Rust Format: ${{ steps.rustfmt.outcome }}"
          echo "Clippy: ${{ steps.clippy.outcome }}"
          echo "Frontend Tests: ${{ steps.frontend-test.outcome }}"
          echo "Backend Tests: ${{ steps.backend-test.outcome }}"
          echo "===================="

          if [[ "${{ steps.tsc.outcome }}" == "failure" || \
                "${{ steps.biome.outcome }}" == "failure" || \
                "${{ steps.eslint.outcome }}" == "failure" || \
                "${{ steps.rustfmt.outcome }}" == "failure" || \
                "${{ steps.clippy.outcome }}" == "failure" || \
                "${{ steps.frontend-test.outcome }}" == "failure" || \
                "${{ steps.backend-test.outcome }}" == "failure" ]]; then
            echo "❌ One or more checks failed."
            exit 1
          else
            echo "✅ All checks succeeded."
          fi
