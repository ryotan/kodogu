name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          cache-workspace-crates: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cbb1dcaa26e1459e2876c39f61c1e22a1258aac5 # v2
        with:
          tool: cargo-llvm-cov

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Setup mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Cache node_modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: node_modules
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: bun install --frozen-lock-file # change this to npm or pnpm depending on which one you use.

      - name: Install Playwright Browsers
        working-directory: app
        run: bunx playwright install --with-deps chromium chromium-headless-shell

      - name: Generate route files
        working-directory: app
        run: bun run build

      - id: tsc
        name: TypeScript
        working-directory: app
        run: bun run lint:tsc
        continue-on-error: true  # Run all checks, then fail at the end

      - id: biome
        name: Biome
        working-directory: app
        run: bun run lint:biome --reporter=github
        continue-on-error: true  # Run all checks, then fail at the end

      - id: eslint
        name: ESLint
        working-directory: app
        run: bun run lint:es
        continue-on-error: true  # Run all checks, then fail at the end

      - id: rustfmt
        name: Rust Format
        run: mise run cargo:lint:fmt
        continue-on-error: true  # Run all checks, then fail at the end

      - id: clippy
        name: Clippy
        run: mise run cargo:lint:clippy
        continue-on-error: true  # Run all checks, then fail at the end

      - id: frontend-test
        name: Frontend Tests & Coverage
        working-directory: app
        run: bun run test:vitest:coverage
        continue-on-error: true  # Run all checks, then fail at the end

      - id: backend-test
        name: Backend Tests & Coverage
        # WORKAROUND: wayland-client 0.31.8 uses not stable feature (`coverage_attribute`) of Rust 1.85.1 for coverage
        run: mise run cargo:coverage -- --no-cfg-coverage
        continue-on-error: true  # Run all checks, then fail at the end

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/clover.xml,lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail on Codecov service issues
          # Note: Coverage requirements are configured in codecov.yml

      - name: Check for lint and test results
        run: |
          # Fail the build if any lint or test step failed
          # This allows us to see all failures at once, not just the first one
          echo "=== Check Results ==="
          echo "TypeScript: ${{ steps.tsc.outcome }}"
          echo "Biome: ${{ steps.biome.outcome }}"
          echo "ESLint: ${{ steps.eslint.outcome }}"
          echo "Rust Format: ${{ steps.rustfmt.outcome }}"
          echo "Clippy: ${{ steps.clippy.outcome }}"
          echo "Frontend Tests: ${{ steps.frontend-test.outcome }}"
          echo "Backend Tests: ${{ steps.backend-test.outcome }}"
          echo "===================="

          if [[ "${{ steps.tsc.outcome }}" == "failure" || \
                "${{ steps.biome.outcome }}" == "failure" || \
                "${{ steps.eslint.outcome }}" == "failure" || \
                "${{ steps.rustfmt.outcome }}" == "failure" || \
                "${{ steps.clippy.outcome }}" == "failure" || \
                "${{ steps.frontend-test.outcome }}" == "failure" || \
                "${{ steps.backend-test.outcome }}" == "failure" ]]; then
            echo "❌ One or more checks failed."
            exit 1
          else
            echo "✅ All checks succeeded."
          fi
