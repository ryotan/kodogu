name: 'Code Quality'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default-deny token permissions; jobs grant the extra scopes they need.
permissions:
  contents: read

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

jobs:
  checks:
    name: 'Lint - ${{ matrix.platform }}'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        # Linux endpoints were verified in audit mode; keep its existing block policy.
        # macOS and Windows use audit mode, supported by the community tier, to record their endpoints.
        # disable-telemetry is only supported with the block policy.
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          disable-telemetry: ${{ runner.os == 'Linux' }}
          allowed-endpoints: >
            aka.ms:443
            azure.archive.ubuntu.com:80
            cdn.playwright.dev:443
            cli.codecov.io:443
            dl.google.com:443
            download.visualstudio.microsoft.com:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            ingest.codecov.io:443
            keybase.io:443
            mise.jdx.dev:443
            motd.ubuntu.com:443
            nodejs.org:443
            o26192.ingest.us.sentry.io:443
            packages.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            storybook.js.org:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspace-crates: true

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Set cache paths
        run: |
          echo "MISE_CACHE_DIR=$RUNNER_TEMP/mise-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"

      # Cache the files mise downloads, not the installed tools:
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - name: Cache mise download store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MISE_CACHE_DIR }}/downloads-cas
          key: >-
            mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_ENV }}-${{
            hashFiles('.config/mise/config*.toml', '.config/mise/mise*.lock') }}

      - name: Setup mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
          cache: false

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: mise exec -- bun install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSIONS=$(grep -o '"playwright@[^"]*"' bun.lock | tr -d '"')
          if [ -z "$VERSIONS" ]; then
            echo "::warning::Could not extract playwright version from bun.lock. Playwright browsers will not be cached."
          elif [ "$(echo "$VERSIONS" | wc -l)" -gt 1 ]; then
            echo "::warning::Multiple playwright versions found in bun.lock: $VERSIONS. Playwright browsers will not be cached."
          else
            echo "Playwright version: $VERSIONS"
            echo "version=$VERSIONS" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: 0-${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: mise run app:playwright:install

      - id: tsc
        name: TypeScript
        run: mise run app:lint:tsc
        continue-on-error: true  # Run all checks, then fail at the end

      - id: biome
        name: Biome
        run: mise run lint:biome -- --reporter=github
        continue-on-error: true  # Run all checks, then fail at the end

      - id: eslint
        name: ESLint
        run: mise run app:lint:es
        continue-on-error: true  # Run all checks, then fail at the end

      - id: rustfmt
        name: Rust Format
        run: mise run cargo:lint:fmt
        continue-on-error: true  # Run all checks, then fail at the end

      - id: clippy
        name: Clippy
        run: mise run cargo:lint:clippy
        continue-on-error: true  # Run all checks, then fail at the end

      - id: frontend-test
        name: Frontend Tests & Coverage
        run: mise run app:test:coverage
        continue-on-error: true  # Run all checks, then fail at the end

      - name: Upload browser test failure screenshots
        if: ${{ !cancelled() && steps.frontend-test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true  # Keep running the remaining checks if upload fails
        with:
          name: browser-test-failures-${{ runner.os }}
          path: app/.vitest-attachments/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 5

      - id: backend-test
        name: Backend Tests & Coverage${{ runner.os == 'Windows' && ' (excluding Tauri app)' || '' }}
        # tauri-build 2.7.4 omits the Common Controls v6 manifest from the Windows app test executable.
        # Keep kernel and CLI coverage until a released tauri-build supports resources in test executables.
        # WORKAROUND: wayland-client 0.31.8 uses not stable feature (`coverage_attribute`) of Rust 1.85.1 for coverage
        run: mise run cargo:coverage -- --no-cfg-coverage ${{ runner.os == 'Windows' && '--exclude kodogu' || '' }}
        continue-on-error: true  # Run all checks, then fail at the end

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/clover.xml,lcov.info
          flags: unittests
          name: codecov-${{ runner.os }}
          fail_ci_if_error: false  # Don't fail on Codecov service issues
          # Note: Coverage requirements are configured in codecov.yml

      - name: Check for lint and test results
        run: |
          # Fail the build if any lint or test step failed
          # This allows us to see all failures at once, not just the first one
          echo "=== Check Results ==="
          echo "TypeScript: ${{ steps.tsc.outcome }}"
          echo "Biome: ${{ steps.biome.outcome }}"
          echo "ESLint: ${{ steps.eslint.outcome }}"
          echo "Rust Format: ${{ steps.rustfmt.outcome }}"
          echo "Clippy: ${{ steps.clippy.outcome }}"
          echo "Frontend Tests: ${{ steps.frontend-test.outcome }}"
          echo "Backend Tests: ${{ steps.backend-test.outcome }}"
          echo "===================="

          if [[ "${{ steps.tsc.outcome }}" == "failure" || \
                "${{ steps.biome.outcome }}" == "failure" || \
                "${{ steps.eslint.outcome }}" == "failure" || \
                "${{ steps.rustfmt.outcome }}" == "failure" || \
                "${{ steps.clippy.outcome }}" == "failure" || \
                "${{ steps.frontend-test.outcome }}" == "failure" || \
                "${{ steps.backend-test.outcome }}" == "failure" ]]; then
            echo "❌ One or more checks failed."
            exit 1
          else
            echo "✅ All checks succeeded."
          fi

  lint:
    name: 'Lint'
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check all platform results
        shell: bash
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
