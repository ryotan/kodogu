name: Workflow Lint

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow Lint
    uses: ryotan/tempura/.github/workflows/workflow-lint.yaml@ed4fd08eaa7a7c2d7f02f4021a0a226c0e3c9bdb # v0.0.1
