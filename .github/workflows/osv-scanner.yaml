name: 'OSV-Scanner'

# Block PRs that introduce dependencies with a vulnerability listed in the OSV database.
# Uses Google's osv-scanner-action reusable workflow instead of GitHub's dependency-review-action
# — the latter requires GitHub Advanced Security on private repositories, which we do not have here.
# OSV.dev is also the database Renovate is configured to read from (`osvVulnerabilityAlerts: true`),
# so the two layers stay consistent.
on:
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  actions: read
  contents: read
  # Declared so the reusable workflow's permission requirement is met;
  # the SARIF upload step is skipped via `upload-sarif: false` below
  # because Code Scanning needs GHAS on private repos.
  security-events: write

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      upload-sarif: false
