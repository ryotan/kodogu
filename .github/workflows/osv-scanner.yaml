name: 'OSV-Scanner'

# Block PRs that introduce dependencies with a vulnerability listed in the OSV database.
# Kept alongside dependency-review.yaml, which cannot read `bun.lock`.
# OSV.dev is also the database Renovate is configured to read from (`osvVulnerabilityAlerts: true`),
# so the two layers stay consistent.
on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: osv-scanner-caller-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan-pr:
    permissions:
      contents: read
      actions: read # Required by the reusable scanner's workflow permission contract.
      # The called workflow declares the SARIF scope independently of its upload-sarif input.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: false
