name: 'Build'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tauri:
    name: 'Tauri - ${{ matrix.platform }}'
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-26'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
          - platform: 'windows-2025-vs2026'
            target: ''

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        # Linux endpoints were verified in audit mode; keep its existing block policy.
        # macOS and Windows use audit mode, supported by the community tier, to record their endpoints.
        # disable-telemetry is only supported with the block policy.
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          disable-telemetry: ${{ runner.os == 'Linux' }}
          allowed-endpoints: >
            aka.ms:443
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            dl.google.com:443
            download.visualstudio.microsoft.com:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            mise.jdx.dev:443
            motd.ubuntu.com:443
            nodejs.org:443
            packages.microsoft.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443
            *.ec2.archive.ubuntu.com:80

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update --error-on=any
          # Disable retries while updating APT to prevent CVE-2026-109518 before installing dependencies.
          sudo apt-get -o Acquire::Retries=0 install -y --only-upgrade '?source-package(^apt$)'
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: step-security/setup-rust-toolchain@f547b7511b1e8f8d1cda8ef9f27bc365e7761fee # v2.0.0
        with:
          cache-workspace-crates: true
          target: ${{ matrix.target }}

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Set cache paths
        run: |
          echo "MISE_CACHE_DIR=$RUNNER_TEMP/mise-cache" >> "$GITHUB_ENV"

      # Cache the files mise downloads, not the installed tools:
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - name: Cache mise download store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MISE_CACHE_DIR }}/downloads-cas
          key: >-
            mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.MISE_ENV }}-${{
            hashFiles('.config/mise/config*.toml', '.config/mise/mise*.lock') }}

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.12'
          cache: false

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: mise exec -- bun install --frozen-lockfile

      - name: Build app
        env:
          FORCE_COLOR: '0'
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export TAURI_BUNDLER_DMG_IGNORE_CI="${TAURI_BUNDLER_DMG_IGNORE_CI-true}"
          fi
          args=()
          if [[ -n "$TAURI_TARGET" ]]; then
            args+=(--target "$TAURI_TARGET")
          fi
          mise run //:app:tauri -- build "${args[@]}"
