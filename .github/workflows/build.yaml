name: 'Build'

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

permissions:
  contents: read

jobs:
  tauri:
    name: 'Tauri - ${{ matrix.platform }}'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          # - platform: 'windows-latest'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Harden Runner
        # Block unexpected egress and process activity on the runner. Endpoints below were baselined from
        # the audit-mode log observed across recent successful runs — on Linux only, since that is the sole
        # platform currently enabled in the matrix above.
        #
        # Since v2.20.0 the block policy is enforced on macOS and Windows too, and it is applied by the
        # action's `pre` step, which has no `pre-if` and therefore cannot be skipped with a step-level `if:`.
        # Re-enabling the macOS/Windows matrix entries would otherwise fail them against this Linux-only
        # allowlist; keeping those platforms on audit lets their first runs produce their own baseline.
        # `disable-telemetry` follows the same split: harden-runner allows it only with the block policy, and
        # the audit runs need telemetry to produce that baseline.
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
          disable-telemetry: ${{ runner.os == 'Linux' }}
          allowed-endpoints: >
            aka.ms:443
            azure.archive.ubuntu.com:80
            _http._tcp.azure.archive.ubuntu.com:80
            dl.google.com:443
            _https._tcp.dl.google.com:443
            download.visualstudio.microsoft.com:443
            esm.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            mise.jdx.dev:443
            mise-java.jdx.dev:443
            motd.ubuntu.com:443
            _https._tcp.motd.ubuntu.com:443
            nodejs.org:443
            packages.microsoft.com:443
            _https._tcp.packages.microsoft.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.githubapp.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspace-crates: true
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.3'

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Cache node_modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lock-file

      - name: Build app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || null }}  # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || null }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          projectPath: app
          args: ${{ matrix.args }}
