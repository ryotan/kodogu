name: 'Build'

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

# Force mise to re-verify SLSA / GitHub attestations on every install. `paranoid = true` in the project
# `.config/mise/config.toml` is a silent no-op (mise 2026.x+ ignores it in non-global configs as a security
# ratchet), so we enforce it via env in CI.
env:
  MISE_PARANOID: 'true'

jobs:
  tauri:
    name: 'Tauri - ${{ matrix.platform }}'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          # - platform: 'windows-latest'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Harden Runner
        # Monitor and (in audit mode) report unexpected egress and process activity on the runner.
        # Switch `egress-policy` to `block` after the audit log shows the expected outbound endpoints.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspace-crates: true
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install additional problem matchers
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0

      - name: Cache Bun global cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Cache node_modules
        if: github.event_name == 'pull_request'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: 0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            0-${{ runner.os }}-bun-${{ hashFiles('**/*.patch') }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lock-file

      - name: Build app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || null }}  # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || null }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          projectPath: app
          args: ${{ matrix.args }}
