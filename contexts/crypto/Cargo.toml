[package]
name = "kodogu-crypto"
version = "0.1.0"
edition = "2024"
description = "Cryptographic operations library for KoDoGu"
authors = ["ryotan"]

[lib]
name = "kodogu_crypto"
path = "src/lib.rs"

[dependencies]
# Error handling (project standard)
suzunari-error = { git = "https://github.com/ryotan/suzunari-error.git", version = "0.1.0" }
suzunari-error-macro-impl = { git = "https://github.com/ryotan/suzunari-error.git", version = "0.1.0" }
snafu = "0.8"

# Cryptography (adapter layer only)
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
aes-gcm = { version = "0.10", features = ["std"] }
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.22.0"
