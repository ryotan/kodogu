#:schema https://mise.jdx.dev/schema/mise-task.json

["app:dev"]
description = "Start the frontend development server"
dir = "apps/desktop/app-root"
run = "bun x --no-install vite"

["app:build"]
description = "Build the frontend"
dir = "apps/desktop/app-root"
run = "bun x --no-install vite build"

["app:preview"]
description = "Preview the frontend build"
dir = "apps/desktop/app-root"
run = "bun x --no-install vite preview"

["app:tauri"]
description = "Run the Tauri CLI"
dir = "apps/desktop/app-root"
run = "bun x --no-install tauri"

["app:tauri:build"]
description = "Build the production desktop app"
dir = "apps/desktop/app-root"
run = "bun x --no-install tauri build --config src-tauri/tauri.prod.conf.json"

["app:playwright:install"]
description = "Install Chromium and its system dependencies"
dir = "apps/desktop/app-root"
run = "bun x --no-install playwright install --with-deps chromium chromium-headless-shell"

["app:lint:tsc"]
description = "Check frontend TypeScript types"
dir = "apps/desktop/app-root"
run = "bun x --no-install tsc -b ../../.."

["app:test"]
description = "Run the tests of every frontend package, each in its package"
run = 'mise run --tag frontend "//...:test"'

["app:test:coverage"]
description = "Run the tests of every frontend package with coverage, and merge the reports into coverage/"
run = "bun tooling/vitest-config/coverage-merge.ts"

["app:storybook:build"]
description = "Build the Storybook of every package that has one"
run = 'mise run --tag storybook "//...:storybook:build"'

["app:lint:es"]
description = "Check the ESLint rules of every frontend package"
run = 'mise run --tag frontend "//...:lint:es"'

["app:fix:es"]
description = "Apply the ESLint fixes of every frontend package"
wait_for = ["fix:biome"]
run = 'mise run --tag frontend "//...:fix:es"'
