#:schema https://mise.jdx.dev/schema/mise-task.json

["cargo:lint"]
description = "Lint the Cargo workspace"
depends = ["cargo:lint:fmt", "cargo:lint:clippy"]

["cargo:lint:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

["cargo:lint:clippy"]
description = "Check Rust Clippy rules"
run = "cargo clippy --locked --no-deps --all-features --all-targets --release"

["cargo:fix"]
description = "Apply Rust fixes and formatting"
depends = ["cargo:fix:clippy", "cargo:fix:fmt"]

["cargo:fix:clippy"]
wait_for = ["fix:biome"]
description = "Apply Rust Clippy fixes"
run = "cargo clippy --locked --fix --all-features --all-targets --allow-dirty --allow-staged"

["cargo:fix:fmt"]
description = "Apply Rust formatting"
wait_for = ["cargo:fix:clippy"]
run = "cargo fmt --all"

["cargo:test"]
description = "Run Cargo workspace tests"
run = "cargo test --all-features --workspace"

["cargo:coverage"]
description = "Collect Cargo workspace test coverage"
run = "cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info"
