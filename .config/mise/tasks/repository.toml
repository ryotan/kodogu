#:schema https://mise.jdx.dev/schema/mise-task.json

[lint]
description = "Lint the repository"
run = "mise run --continue-on-error lint:biome ::: app:lint:tsc ::: app:lint:es ::: cargo:lint"

[test]
description = "Test the repository"
run = "mise run --continue-on-error app:test ::: cargo:test"

["test:coverage"]
description = "Collect frontend and Rust test coverage"
run = "mise run --continue-on-error app:test:coverage ::: cargo:coverage"

[fix]
description = "Apply automatic fixes across the repository"
# Independent fixes must finish even when another fix fails.
run = "mise run --continue-on-error fix:biome ::: app:fix:es ::: cargo:fix"

["lint:biome"]
description = "Check repository formatting and Biome rules"
run = "bun x --no-install biome ci --error-on-warnings ."

["fix:biome"]
description = "Apply Biome fixes across the repository"
run = "bun x --no-install biome check --write --unsafe ."
