#:schema https://mise.jdx.dev/schema/mise-task.json

[lint]
description = "Lint the repository"
depends = ["lint:biome", "app:lint:tsc", "app:lint:es", "cargo:lint"]

[test]
description = "Test the repository"
depends = ["app:test", "cargo:test"]

[fix]
description = "Apply automatic fixes across the repository"
# Independent fixes must finish even when another fix fails.
run = "mise run --continue-on-error app:fix:es ::: fix:biome ::: cargo:fix"

["lint:biome"]
description = "Check repository formatting and Biome rules"
run = "bun x --no-install biome ci --error-on-warnings ."

["fix:biome"]
description = "Apply Biome fixes across the repository"
wait_for = ["app:fix:es"]
run = "bun x --no-install biome check --write --unsafe ."
