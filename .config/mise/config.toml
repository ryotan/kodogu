[settings]
auto_install = false

# Fetch version lists and attestations from upstream (e.g. the GitHub API) instead of mise-versions.jdx.dev.
use_versions_host = false

# Mitigate supply-chain attacks: only resolve tool versions that have been released for at least 7 days. Mirrors
# `minimumReleaseAge` in `.github/renovate.json5`. Pinned versions in [tools] below bypass this filter (they are
# exact pins, not fuzzy queries); the setting primarily affects `mise upgrade` / `mise latest` /
# `mise use --fuzzy` resolution.
minimum_release_age = "7d"

# Block backends that are unsafe to use or that mise.lock cannot meaningfully verify. The unblocked backends —
# core, aqua, github, gitlab, forgejo — all record per-platform checksum + provenance.
#   - asdf, vfox       : execute arbitrary plugin code (bash/Lua) at install
#   - ubi              : deprecated upstream in favour of the github backend
#   - cargo/npm/pipx/gem/go/dotnet/conda/spm
#                      : mise.lock records "version only" for these — no SHA, no provenance. If you need such a
#                        tool, prefer a github/aqua entry that ships a verified binary; if none exists, install it
#                        directly with the ecosystem's own tooling instead of pretending mise is verifying it.
#   - http, s3         : raw-URL installs we have no current use for
# mise has no positive `enable_backends` switch, hence the long denylist.
disable_backends = [
  "asdf",
  "vfox",
  "ubi",
  "cargo",
  "npm",
  "pipx",
  "gem",
  "go",
  "dotnet",
  "conda",
  "spm",
  "http",
  "s3",
]

# mise.lock enforcement:
#   lockfile → write checksums + provenance to mise.lock
#   locked   → require matching lockfile entries for installation
#   paranoid → re-verify SLSA / GitHub attestations on every install. Not declared here: mise treats
#              `paranoid` as a security ratchet (mise 2026.x+) and silently ignores it in non-global
#              configs, so any value here would be a misleading no-op. Local dev inherits the setting
#              from the user global config (`~/.config/mise/config.toml`); CI sets `MISE_PARANOID=true`
#              via workflow env.
lockfile = true
locked = true
# Local development (macos-arm64, windows-x64) and the CI runners (linux-x64), plus the x64 variants that bun
# always records
lockfile_platforms = [
  "macos-arm64",
  "linux-x64",
  "linux-x64-baseline",
  "linux-x64-musl",
  "linux-x64-musl-baseline",
  "windows-x64",
  "windows-x64-baseline",
]

[tools]
node = "24.21.0"
bun = "1.4.2"
java = "microsoft-17.35.1"
"github:taiki-e/cargo-llvm-cov" = "v0.9.1"
prek = "0.5.5"

[tasks."cargo:fix"]
depends = [
  "cargo:fix:fmt",
  "cargo:fix:clippy",
]

[tasks."cargo:fix:fmt"]
run = "cargo fmt --all"

[tasks."cargo:fix:clippy"]
run = "cargo clippy --locked --fix --all-features --all-targets --allow-dirty --allow-staged"

[tasks."cargo:lint"]
depends = [
  "cargo:lint:fmt",
  "cargo:lint:clippy",
]

[tasks."cargo:lint:fmt"]
run = "cargo fmt --all --check"

[tasks."cargo:lint:clippy"]
run = "cargo clippy --locked --no-deps --all-features --all-targets --release"

[tasks."cargo:test"]
run = "cargo test --all-features --workspace"

[tasks."cargo:coverage"]
run = "cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info"
