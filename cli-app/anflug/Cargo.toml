[package]
name = "anflug"
version = "0.1.0"
edition = "2024"

[lib]
name = "anflug"
path = "src/lib.rs"

[[bin]]
name = "anflug"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env", "unicode"] }
confy = { version = "1.0.0" }
once_cell = "1.19"
regex = "1.11.2"
serde = { version = "1.0.225", features = ["derive"] }
snafu = "0.8"
validator = { version = "0.18", features = ["derive"] }
tokio = { version = "1.0", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

suzunari-error = { git = "https://github.com/ryotan/suzunari-error.git", version = "0.1.0" }
suzunari-error-macro-impl = { git = "https://github.com/ryotan/suzunari-error.git", version = "0.1.0" }

[features]
default = []
async = ["tokio", "futures"]

[dev-dependencies]
tempfile = "3.22.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "file_processing"
harness = false

[[bench]]
name = "regex_caching"
harness = false

[[bench]]
name = "template_processing"
harness = false
